<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary-dark: #0f172a;
            --secondary-dark: #1e293b;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-light: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.88);
            --border-color: #dbe3ee;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --na-color: #94a3b8;
            --na-bg: #f8fafc;
            --highlight-bg: #fde68a;
            --highlight-text: #854d0e;
            --shadow-lg: 0 24px 70px rgba(15, 23, 42, 0.12);
            --shadow-md: 0 14px 35px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 32%),
                radial-gradient(circle at top right, rgba(15, 23, 42, 0.08), transparent 28%),
                linear-gradient(180deg, #f8fbff 0%, var(--bg-light) 100%);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            padding: 1.25rem;
        }

        .page-shell {
            max-width: 1480px;
            margin-left: auto;
            margin-right: auto;
        }

        header {
            margin-bottom: 1rem;
            padding: 1.5rem 1.5rem 0.5rem;
        }

        .hero {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .hero-copy {
            flex: 1 1 420px;
        }

        h1 {
            font-size: clamp(1.6rem, 2.2vw, 2.35rem);
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .hero-note {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 62ch;
            margin-bottom: 0.75rem;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark));
            padding: 0.78rem 1rem;
            border-radius: 999px;
            box-shadow: var(--shadow-md);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .back-link:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .page-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.7rem 0.95rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.76);
            border: 1px solid rgba(148, 163, 184, 0.28);
            color: var(--text-main);
            font-size: 0.92rem;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
        }

        .search-container {
            position: relative;
            max-width: 560px;
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.7rem;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 213, 0.15);
        }

        .benefit-picker {
            margin: 0.25rem 0 1rem;
            padding: 1rem;
            border: 1px solid rgba(219, 227, 238, 0.95);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.76);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
        }

        .benefit-picker-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.9rem;
            flex-wrap: wrap;
        }

        .benefit-picker-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 0.25rem;
        }

        .benefit-picker-note {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .benefit-picker-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .picker-button {
            border: 1px solid rgba(148, 163, 184, 0.28);
            background: #ffffff;
            color: var(--primary-dark);
            border-radius: 999px;
            padding: 0.55rem 0.85rem;
            font-size: 0.86rem;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
        }

        .picker-button:hover {
            transform: translateY(-1px);
            border-color: rgba(37, 99, 235, 0.35);
        }

        .benefit-checkboxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.5rem;
        }

        .benefit-checkbox {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.65rem 0.75rem;
            border-radius: 12px;
            border: 1px solid rgba(219, 227, 238, 0.95);
            background: rgba(248, 250, 252, 0.82);
            font-size: 0.88rem;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }

        .benefit-checkbox input {
            accent-color: var(--accent-blue);
            flex: 0 0 auto;
        }

        .benefit-checkbox span {
            line-height: 1.2;
        }

        .search-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .table-container {
            width: 100%;
            margin: 0 auto;
            overflow-x: auto;
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(219, 227, 238, 0.95);
        }

        table {
            width: 100%;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            font-size: 0.84rem;
            table-layout: fixed;
        }

        th {
            background-color: var(--primary-dark);
            color: #ffffff;
            padding: 0.9rem 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid var(--secondary-dark);
            letter-spacing: 0.01em;
        }

        th:first-child {
            position: sticky;
            left: 0;
            z-index: 12;
            background-color: var(--primary-dark);
        }

        td {
            padding: 1rem 0.9rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            min-width: 180px;
            max-width: none;
            background-color: rgba(255, 255, 255, 0.8);
            transition: background-color 0.15s;
            word-break: break-word;
        }

        td:first-child {
            position: sticky;
            left: 0;
            z-index: 8;
            background-color: #f8fafc;
            font-weight: 600;
            border-right: 2px solid var(--border-color);
            min-width: 220px;
            max-width: 220px;
        }

        tr:hover td {
            background-color: #eef4fb;
        }

        tr:hover td:first-child {
            background-color: #e2e8f0;
        }

        .card-link {
            color: var(--accent-blue);
            text-decoration: none;
            transition: color 0.15s;
            display: block;
        }

        .card-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .benefit-cell {
            cursor: pointer;
        }

        .benefit-cell .cell-summary {
            display: block;
            line-height: 1.55;
            max-width: 28ch;
        }

        .benefit-cell.na-cell {
            color: var(--na-color);
            font-style: italic;
            background-color: var(--na-bg);
            cursor: default;
        }

        .benefit-ul {
            list-style-type: none;
        }

        .benefit-li {
            position: relative;
            padding-left: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .benefit-li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--accent-blue);
            font-weight: bold;
        }

        .na-cell .benefit-li::before {
            color: var(--na-color);
        }

        mark.highlight {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 0 2px;
            border-radius: 2px;
        }

        /* Modal Layout */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background-color: #ffffff;
            border-radius: 20px;
            width: min(92vw, 760px);
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95);
            transition: transform 0.25s ease;
            position: relative;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.35rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark));
            color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 2;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .modal-subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .modal-close-btn {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.15s;
            line-height: 1;
        }

        .modal-close-btn:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 1.35rem 1.5rem 1.5rem;
        }

        .modal-section {
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.25rem;
        }

        .modal-section:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .modal-section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            font-weight: 600;
        }

        .modal-section.lead-section {
            background: #f8fbff;
            border: 1px solid #e5eef9;
            border-radius: 14px;
            padding: 1rem 1rem 0.9rem;
        }

        .modal-section-content {
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .na-modal-msg {
            text-align: center;
            color: var(--na-color);
            font-style: italic;
            padding: 2rem 0;
        }

        .empty-state-cell {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--text-muted);
            background: rgba(248, 250, 252, 0.92);
        }

        .empty-state-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 0.35rem;
        }

        .empty-state-copy {
            font-size: 0.92rem;
        }

        @media (max-width: 960px) {
            body {
                padding: 0.75rem;
            }

            header {
                padding: 1.15rem 0.9rem 0.5rem;
            }

            .hero {
                gap: 0.85rem;
            }

            .hero-actions {
                width: 100%;
            }

            .back-link,
            .page-chip {
                width: 100%;
                justify-content: center;
            }

            .table-container {
                border-radius: 16px;
            }

            .benefit-picker {
                padding: 0.85rem;
            }

            .benefit-checkboxes {
                grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
            }

            table {
                min-width: 1200px;
            }

            td {
                min-width: 170px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .hero-copy {
                flex-basis: 100%;
            }

            .search-input {
                font-size: 1rem;
            }

            .table-container {
                box-shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
            }

            .modal-container {
                width: min(94vw, 760px);
                max-height: 90vh;
                border-radius: 18px;
            }

            .modal-header,
            .modal-body {
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }
    </style>
</head>

        const keyMapping = [
            "lounge", "transfers", "insurance", "hotel", "airline", "dining", 
            "cashback", "rewards", "golf", "fitness", "concierge", 
            "entertainment", "lifestyle", "protection", "other"
        ];

        const tableBody = document.getElementById('tableBody');
        const tableHead = document.getElementById('tableHead');
        const table = document.getElementById('comparisonTable');
        const searchBar = document.getElementById('searchBar');
        const modal = document.getElementById('benefitModal');
        const modalClose = document.getElementById('modalClose');
        const benefitCheckboxes = document.getElementById('benefitCheckboxes');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const columnLabels = {
            lounge: 'Lounge',
            transfers: 'Transfers',
            insurance: 'Insurance',
            hotel: 'Hotel',
            airline: 'Airline',
            dining: 'Dining',
            cashback: 'Cashback',
            rewards: 'Rewards',
            golf: 'Golf',
            fitness: 'Fitness',
            concierge: 'Concierge',
            entertainment: 'Entertainment',
            lifestyle: 'Lifestyle',
            protection: 'Protection',
            other: 'Other'
        };

        let selectedBenefitKeys = [];

        function splitBenefitText(rawString) {
            return rawString
                .split(/\s*(?:—|\|)\s*/)
                .map(part => part.trim())
                .filter(Boolean);
        }

        function summarizeBenefit(rawString) {
            if (rawString === 'N/A') {
                return 'N/A';
            }

            const parts = splitBenefitText(rawString);
            if (parts.length === 0) {
                return rawString;
            }

            if (parts.length === 1) {
                return parts[0];
            }

            return `${parts[0]}: ${parts[1]}`;
        }

        function renderBenefitCheckboxes() {
            benefitCheckboxes.innerHTML = '';

            keyMapping.forEach((key) => {
                const label = document.createElement('label');
                label.className = 'benefit-checkbox';

                const input = document.createElement('input');
                input.type = 'checkbox';
                input.value = key;
                input.checked = selectedBenefitKeys.includes(key);
                input.addEventListener('change', () => {
                    if (input.checked) {
                        if (!selectedBenefitKeys.includes(key)) {
                            selectedBenefitKeys.push(key);
                        }
                    } else {
                        selectedBenefitKeys = selectedBenefitKeys.filter((item) => item !== key);
                    }
                    renderTable(searchBar.value);
                });

                const text = document.createElement('span');
                text.textContent = columnLabels[key] || key;

                label.appendChild(input);
                label.appendChild(text);
                benefitCheckboxes.appendChild(label);
            });
        }

        function renderTableHeader() {
            const headers = ['Card', ...selectedBenefitKeys.map((key) => columnLabels[key] || key)];
            tableHead.innerHTML = '';

            const tr = document.createElement('tr');
            headers.forEach((headerText) => {
                const th = document.createElement('th');
                th.textContent = headerText;
                tr.appendChild(th);
            });

            tableHead.appendChild(tr);
        }

        // Render the matrix dynamically based on search terms
        function renderTable(filterTerm = '') {
            renderTableHeader();
            tableBody.innerHTML = '';
            const cleanFilter = filterTerm.toLowerCase().trim();

            const activeBenefitKeys = selectedBenefitKeys.slice();

            table.style.minWidth = `${Math.max(420, 240 + activeBenefitKeys.length * 190)}px`;

            if (activeBenefitKeys.length === 0) {
                const emptyRow = document.createElement('tr');
                const emptyCell = document.createElement('td');
                emptyCell.colSpan = 1;
                emptyCell.className = 'empty-state-cell';
                emptyCell.innerHTML = `
                    <div class="empty-state-title">No benefits selected yet</div>
                    <div class="empty-state-copy">Tick one or more boxes above to populate the comparison table.</div>
                `;
                emptyRow.appendChild(emptyCell);
                tableBody.appendChild(emptyRow);
                return;
            }

            cardsData.forEach((card, rowIndex) => {
                // Determine if row matches query globally
                let matchesSearch = false;
                if (card.name.toLowerCase().includes(cleanFilter)) {
                    matchesSearch = true;
                }
                
                if (!matchesSearch) {
                    for (let key in card.benefits) {
                        if (card.benefits[key].toLowerCase().includes(cleanFilter)) {
                            matchesSearch = true;
                            break;
                        }
                    }
                }

                if (cleanFilter !== '' && !matchesSearch) return; // Filter out rows not matching query

                const tr = document.createElement('tr');
                
                // Card column creation
                const tdCard = document.createElement('td');
                tdCard.setAttribute('data-label', 'Card');
                const a = document.createElement('a');
                a.href = card.url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.className = "card-link";
                a.innerHTML = highlightMarkup(card.name, cleanFilter);
                tdCard.appendChild(a);
                tr.appendChild(tdCard);

                // Benefits columns creation
                activeBenefitKeys.forEach(key => {
                    const td = document.createElement('td');
                    td.setAttribute('data-label', columnLabels[key] || key);
                    const rawValue = card.benefits[key];

                    if (rawValue === "N/A") {
                        td.className = "benefit-cell na-cell";
                        td.innerHTML = '<ul class="benefit-ul"><li class="benefit-li">N/A</li></ul>';
                    } else {
                        td.className = "benefit-cell";
                        td.innerHTML = `<span class="cell-summary">${highlightMarkup(summarizeBenefit(rawValue), cleanFilter)}</span>`;
                        // Click management to capture cell context
                        td.addEventListener('click', () => openBenefitDetails(card.name, key, rawValue));
                    }
                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            });
        }

        // Highlight matching substrings safely within HTML markup
        function highlightMarkup(text, pattern) {
            if (!pattern || text === "N/A") return text;
            const escapedPattern = pattern.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(`(${escapedPattern})`, 'gi');
            return text.replace(regex, '<mark class="highlight">$1</mark>');
        }

        // Deep-dive analysis and text parsing for the modal display
        function openBenefitDetails(cardName, technicalKey, rawString) {
            document.getElementById('mCardName').innerText = cardName;
            
            // Format column key for user view
            const humanReadableKey = technicalKey.charAt(0).toUpperCase() + technicalKey.slice(1);
            document.getElementById('mBenefitType').innerText = humanReadableKey === 'Transfers' ? 'Airport Transfers' : 
                                                               humanReadableKey === 'Insurance' ? 'Travel Insurance' : 
                                                               humanReadableKey === 'Protection' ? 'Insurance & Protection' : 
                                                               humanReadableKey === 'Other' ? 'Other Benefits' : humanReadableKey + ' Benefits';

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '';

            const parts = splitBenefitText(rawString);

            if (parts.length >= 2) {
                const overviewContent = [parts[0], parts[1]].filter(Boolean).join(' - ');
                const useDetails = parts[2] || 'No separate usage steps were provided for this benefit.';
                const limitDetails = parts[3] || 'No explicit frequency limit was listed.';
                const supportDetails = [parts[1], parts[2]].filter(Boolean).join(' ');
                const structuralSections = [
                    { title: 'Overview', content: overviewContent, lead: true },
                    { title: 'How it works', content: parts[2] || 'Present the card, app, or linked account where supported.' },
                    { title: 'Eligibility or spend', content: useDetails.toLowerCase().includes('spend') ? useDetails : 'Any spend thresholds are shown in the benefit summary above.' },
                    { title: 'Limits', content: limitDetails },
                    { title: 'Provider notes', content: supportDetails.includes('Visa') ? 'Visa network benefit' : supportDetails.includes('Mastercard') ? 'Mastercard network benefit' : 'Bank or partner benefit' }
                ];

                structuralSections.forEach(section => {
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = "modal-section";
                    if (section.lead) {
                        sectionDiv.classList.add('lead-section');
                    }
                    
                    const titleDiv = document.createElement('div');
                    titleDiv.className = "modal-section-title";
                    titleDiv.innerText = section.title;
                    
                    const contentDiv = document.createElement('div');
                    contentDiv.className = "modal-section-content";
                    contentDiv.innerText = section.content;
                    
                    sectionDiv.appendChild(titleDiv);
                    sectionDiv.appendChild(contentDiv);
                    modalBody.appendChild(sectionDiv);
                });
            } else {
                modalBody.innerHTML = `<div class="na-modal-msg">No detailed breakdown is available for this benefit.</div>`;
            }

            modal.classList.add('active');
        }

        // Close modal workflows
        function closeModal() {
            modal.classList.remove('active');
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });

        // Search interface pipeline execution
        searchBar.addEventListener('input', (e) => {
            renderTable(e.target.value);
        });

        selectAllBtn.addEventListener('click', () => {
            selectedBenefitKeys = keyMapping.slice();
            renderBenefitCheckboxes();
            renderTable(searchBar.value);
        });

        clearAllBtn.addEventListener('click', () => {
            selectedBenefitKeys = [];
            renderBenefitCheckboxes();
            renderTable(searchBar.value);
        });

        // Initial launch configuration
        renderBenefitCheckboxes();
        renderTable();
    </script>
