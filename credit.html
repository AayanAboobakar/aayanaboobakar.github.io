<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAE Credit Card Benefits Comparison Dashboard</title>
    <style>
        :root {
            --ink: #172033;
            --ink-soft: #4e5b70;
            --muted: #728095;
            --surface: #ffffff;
            --surface-soft: #f7f9fc;
            --surface-tint: #eef6f3;
            --line: #dfe6ef;
            --line-strong: #cbd6e4;
            --accent: #277467;
            --accent-strong: #1f5f55;
            --accent-soft: #e7f3f0;
            --warning-bg: #fff6d7;
            --warning-text: #67510d;
            --na-text: #8a96a8;
            --na-bg: #f4f6f9;
            --shadow-lg: 0 22px 70px rgba(33, 45, 65, 0.12);
            --shadow-md: 0 12px 32px rgba(33, 45, 65, 0.08);
            --radius-lg: 18px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #fbfcfd 0%, #f2f6f8 100%);
            color: var(--ink);
            line-height: 1.55;
            min-height: 100vh;
            padding: clamp(0.75rem, 2vw, 1.5rem);
        }

        .page-shell {
            max-width: 1440px;
            margin-left: auto;
            margin-right: auto;
        }

        header {
            margin-bottom: 1rem;
            padding: clamp(1rem, 2vw, 1.5rem) 0 0.25rem;
        }

        .hero {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.1rem;
        }

        .hero-copy {
            flex: 1 1 420px;
        }

        h1 {
            font-size: clamp(1.75rem, 3.2vw, 2.65rem);
            color: var(--ink);
            margin-bottom: 0.5rem;
            font-weight: 760;
            letter-spacing: 0;
            line-height: 1.08;
        }

        .hero-note {
            color: var(--ink-soft);
            font-size: clamp(0.95rem, 1.3vw, 1.03rem);
            max-width: 62ch;
            margin-bottom: 0.75rem;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .back-link,
        .page-chip,
        .picker-button,
        .benefit-checkbox,
        .search-input,
        .benefit-cell,
        .modal-close-btn {
            -webkit-tap-highlight-color: transparent;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            text-decoration: none;
            color: var(--accent-strong);
            background: var(--accent-soft);
            border: 1px solid rgba(39, 116, 103, 0.18);
            padding: 0.72rem 0.95rem;
            border-radius: var(--radius-md);
            font-weight: 650;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .back-link:hover {
            transform: translateY(-1px);
            border-color: rgba(39, 116, 103, 0.3);
            background: #dff0ec;
        }

        .page-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.72rem 0.95rem;
            border-radius: var(--radius-md);
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--ink-soft);
            font-size: 0.92rem;
        }

        .search-container {
            position: relative;
            max-width: 620px;
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.92rem 1rem 0.92rem 2.75rem;
            font-size: 1rem;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            background-color: var(--surface);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(39, 116, 103, 0.13);
        }

        .search-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .benefit-picker {
            margin: 0.25rem 0 1rem;
            padding: clamp(0.85rem, 1.7vw, 1.15rem);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            background: var(--surface);
            box-shadow: var(--shadow-md);
        }

        .benefit-picker-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.9rem;
            flex-wrap: wrap;
        }

        .benefit-picker-title {
            font-size: 0.98rem;
            font-weight: 720;
            color: var(--ink);
            margin-bottom: 0.25rem;
        }

        .benefit-picker-note {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .benefit-picker-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .picker-button {
            border: 1px solid var(--line);
            background: var(--surface-soft);
            color: var(--ink);
            border-radius: 10px;
            padding: 0.58rem 0.85rem;
            font-size: 0.86rem;
            font-weight: 650;
            cursor: pointer;
            min-height: 40px;
            transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
        }

        .picker-button:hover {
            transform: translateY(-1px);
            border-color: rgba(39, 116, 103, 0.35);
        }

        .benefit-checkboxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 0.5rem;
        }

        .benefit-checkbox {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.65rem 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--surface-soft);
            font-size: 0.88rem;
            color: var(--ink);
            cursor: pointer;
            user-select: none;
            min-height: 44px;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .benefit-checkbox:hover,
        .benefit-checkbox:has(input:checked) {
            background: var(--accent-soft);
            border-color: rgba(39, 116, 103, 0.3);
        }

        .benefit-checkbox input {
            accent-color: var(--accent);
            flex: 0 0 auto;
        }

        .benefit-checkbox span {
            line-height: 1.2;
        }

        .table-container {
            width: 100%;
            margin: 0 auto;
            overflow-x: auto;
            background-color: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--line);
            scrollbar-color: var(--line-strong) transparent;
        }

        table {
            width: 100%;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            font-size: 0.86rem;
            table-layout: fixed;
        }

        th {
            background-color: #eef4f6;
            color: var(--ink);
            padding: 0.88rem 0.85rem;
            font-weight: 720;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--line-strong);
            letter-spacing: 0;
        }

        th:first-child {
            position: sticky;
            left: 0;
            z-index: 12;
            background-color: #e7eff2;
        }

        td {
            padding: 1rem 0.9rem;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
            min-width: 180px;
            max-width: none;
            background-color: var(--surface);
            transition: background-color 0.15s;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        td:first-child {
            position: sticky;
            left: 0;
            z-index: 8;
            background-color: #fbfcfd;
            font-weight: 650;
            border-right: 1px solid var(--line-strong);
            min-width: 220px;
            max-width: 220px;
        }

        tr:hover td {
            background-color: #f2f8f6;
        }

        tr:hover td:first-child {
            background-color: #edf5f2;
        }

        .card-link {
            color: var(--accent-strong);
            text-decoration: none;
            transition: color 0.15s;
            display: block;
        }

        .card-link:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .card-thumb {
            display: block;
            width: 100%;
            max-width: 180px;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: var(--surface-soft);
            margin-bottom: 0.45rem;
        }

        .card-name {
            display: block;
            line-height: 1.25;
        }

        .benefit-cell {
            cursor: pointer;
        }

        .benefit-cell:not(.na-cell):hover .cell-summary {
            color: var(--accent-strong);
        }

        .benefit-cell .cell-summary {
            display: block;
            line-height: 1.55;
            max-width: none;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .benefit-cell.na-cell {
            color: var(--na-text);
            font-style: italic;
            background-color: var(--na-bg);
            cursor: default;
        }

        .benefit-ul {
            list-style-type: none;
        }

        .benefit-li {
            position: relative;
            padding-left: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .benefit-li::before {
            content: "";
            position: absolute;
            left: 0.05rem;
            top: 0.65em;
            width: 0.28rem;
            height: 0.28rem;
            border-radius: 999px;
            background: var(--accent);
        }

        .na-cell .benefit-li::before {
            background: var(--na-text);
        }

        mark.highlight {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            padding: 0 2px;
            border-radius: 2px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(20, 29, 43, 0.48);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            padding: 1rem;
            transition: opacity 0.24s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background-color: var(--surface);
            border-radius: var(--radius-lg);
            width: min(92vw, 760px);
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            transform: translateY(14px) scale(0.98);
            transition: transform 0.24s ease;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .modal-overlay.active .modal-container {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            padding: 1.35rem 1.5rem;
            background: var(--surface);
            color: var(--ink);
            position: sticky;
            top: 0;
            z-index: 2;
            border-bottom: 1px solid var(--line);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 760;
            margin-bottom: 0.25rem;
            max-width: calc(100% - 2.5rem);
            line-height: 1.25;
        }

        .modal-subtitle {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .modal-close-btn {
            position: absolute;
            top: 1.1rem;
            right: 1.1rem;
            background: var(--surface-soft);
            border: 1px solid var(--line);
            color: var(--ink-soft);
            border-radius: 999px;
            width: 2.25rem;
            height: 2.25rem;
            font-size: 1.35rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            line-height: 1;
        }

        .modal-close-btn:hover {
            background: var(--accent-soft);
            color: var(--accent-strong);
        }

        .modal-body {
            padding: 1.35rem 1.5rem 1.5rem;
        }

        .modal-section {
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--line);
            padding-bottom: 1.25rem;
        }

        .modal-section:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .modal-section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 0.35rem;
            font-weight: 720;
        }

        .modal-section.lead-section {
            background: var(--surface-tint);
            border: 1px solid #d5e9e4;
            border-radius: var(--radius-md);
            padding: 1rem 1rem 0.9rem;
        }

        .modal-section-content {
            font-size: 0.95rem;
            color: var(--ink);
            overflow-wrap: anywhere;
        }

        .modal-link {
            color: var(--accent-strong);
            text-decoration: none;
            font-weight: 650;
            word-break: break-word;
        }

        .modal-link:hover {
            text-decoration: underline;
        }

        .na-modal-msg {
            text-align: center;
            color: var(--na-text);
            font-style: italic;
            padding: 2rem 0;
        }

        .empty-state-cell {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--muted);
            background: var(--surface-soft);
        }

        .empty-state-title {
            font-size: 1rem;
            font-weight: 720;
            color: var(--ink);
            margin-bottom: 0.35rem;
        }

        .empty-state-copy {
            font-size: 0.92rem;
        }

        @media (max-width: 960px) {
            .hero-actions {
                width: 100%;
            }

            .back-link,
            .page-chip {
                justify-content: center;
            }

            .table-container {
                border-radius: 16px;
            }

            .benefit-checkboxes {
                grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
            }

            table {
                min-width: 1120px;
            }

            td {
                min-width: 170px;
            }

            .card-thumb {
                max-width: 160px;
            }
        }

        @media (max-width: 720px) {
            body {
                padding: 0.65rem;
            }

            .hero {
                gap: 0.75rem;
            }

            .hero-copy {
                flex-basis: 100%;
            }

            .hero-actions,
            .benefit-picker-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                width: 100%;
            }

            .back-link,
            .page-chip {
                width: 100%;
            }

            .page-chip {
                grid-column: 1 / -1;
            }

            .search-container {
                max-width: none;
            }

            .search-input {
                font-size: 1rem;
            }

            .benefit-checkboxes {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .table-container {
                overflow: visible;
                border: none;
                background: transparent;
                box-shadow: none;
                border-radius: 0;
            }

            table,
            thead,
            tbody,
            tr,
            th,
            td {
                display: block;
            }

            table {
                min-width: 0 !important;
                width: 100%;
                font-size: 0.94rem;
            }

            thead {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
            }

            tbody {
                display: grid;
                gap: 0.85rem;
            }

            tr {
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                overflow: hidden;
                background: var(--surface);
                box-shadow: var(--shadow-md);
            }

            td,
            td:first-child {
                position: static;
                min-width: 0;
                max-width: none;
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--line);
                background: var(--surface);
                padding: 0.9rem 1rem;
            }

            td:first-child {
                background: var(--surface-soft);
            }

            td:last-child {
                border-bottom: none;
            }

            tr:hover td,
            tr:hover td:first-child {
                background: var(--surface);
            }

            td:first-child .card-link {
                display: grid;
                grid-template-columns: minmax(96px, 128px) 1fr;
                align-items: center;
                gap: 0.85rem;
            }

            .card-thumb {
                max-width: none;
                margin-bottom: 0;
            }

            td:not(:first-child)::before {
                content: attr(data-label);
                display: block;
                color: var(--muted);
                font-size: 0.76rem;
                font-weight: 760;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                margin-bottom: 0.35rem;
            }

            .empty-state-cell {
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-md);
            }

            .modal-overlay {
                align-items: flex-end;
                padding: 0.65rem;
            }

            .modal-container {
                width: 100%;
                max-height: 88vh;
                border-radius: 18px 18px 14px 14px;
            }

            .modal-header,
            .modal-body {
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }

        @media (max-width: 430px) {
            body {
                padding: 0.5rem;
            }

            h1 {
                font-size: 1.55rem;
            }

            .hero-actions,
            .benefit-picker-actions,
            .benefit-checkboxes {
                grid-template-columns: 1fr;
            }

            td:first-child .card-link {
                grid-template-columns: 1fr;
            }

            .card-thumb {
                max-width: 180px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <div class="table-container">

            <div id="modalBody" class="modal-body">

        </div>
    </div>

        let selectedBenefitKeys = [];

        function splitBenefitText(rawString) {
            return rawString
                .split(/\s*(?:—|\||=)\s*/)
                .map(part => part.trim())
                .filter(Boolean);
        }

        function summarizeBenefit(rawString, benefitKey = '') {
            if (rawString === 'N/A') {
                return 'N/A';
            }

            const parts = splitBenefitText(rawString);
            if (parts.length === 0) {
                return rawString;
            }

            const quickFacts = parts.slice(1, 3).filter(Boolean);

            if (quickFacts.length === 0) {
                return parts[0].replace(/\bBenefits?\b$/i, '').trim();
            }

            const summary = quickFacts.join(' • ');
            return summary.length > 170 ? `${summary.slice(0, 167).trimEnd()}…` : summary;
        }

        function formatBenefitSectionLabel(index) {
            if (index === 0) return 'Benefit';
            if (index === 1) return 'Provider / network';
            if (index === 2) return 'Requirement / trigger';
            if (index === 3) return 'Limit / frequency';
            return 'Additional detail';
        }

        function buildBenefitDetails(rawString) {
            const parts = splitBenefitText(rawString);
            if (parts.length === 0) {
                return [];
            }

            return parts.map((part, index) => ({
                title: formatBenefitSectionLabel(index),
                content: part
            }));
        }

        function renderBenefitCheckboxes() {
            benefitCheckboxes.innerHTML = '';

            keyMapping.forEach((key) => {
                const label = document.createElement('label');
                label.className = 'benefit-checkbox';

                const input = document.createElement('input');
                input.type = 'checkbox';
                input.value = key;
                input.checked = selectedBenefitKeys.includes(key);
                input.addEventListener('change', () => {
                    if (input.checked) {
                        if (!selectedBenefitKeys.includes(key)) {
                            selectedBenefitKeys.push(key);
                        }
                    } else {
                        selectedBenefitKeys = selectedBenefitKeys.filter((item) => item !== key);
                    }
                    renderTable(searchBar.value);
                });

                const text = document.createElement('span');
                text.textContent = columnLabels[key] || key;

                label.appendChild(input);
                label.appendChild(text);
                benefitCheckboxes.appendChild(label);
            });
        }

        function renderTableHeader() {
            const headers = ['Card', ...selectedBenefitKeys.map((key) => columnLabels[key] || key)];
            tableHead.innerHTML = '';

            const tr = document.createElement('tr');
            headers.forEach((headerText) => {
                const th = document.createElement('th');
                th.textContent = headerText;
                tr.appendChild(th);
            });

            tableHead.appendChild(tr);
        }

        // Render the matrix dynamically based on search terms
        function renderTable(filterTerm = '') {
            renderTableHeader();
            tableBody.innerHTML = '';
            const cleanFilter = filterTerm.toLowerCase().trim();

            const activeBenefitKeys = selectedBenefitKeys.slice();

            table.style.minWidth = `${Math.max(420, 240 + activeBenefitKeys.length * 190)}px`;

            if (activeBenefitKeys.length === 0) {
                const emptyRow = document.createElement('tr');
                const emptyCell = document.createElement('td');
                emptyCell.colSpan = 1;
                emptyCell.className = 'empty-state-cell';
                emptyCell.innerHTML = `
                    <div class="empty-state-title">No benefits selected yet</div>
                    <div class="empty-state-copy">Tick one or more boxes above to populate the comparison table.</div>
                `;
                emptyRow.appendChild(emptyCell);
                tableBody.appendChild(emptyRow);
                return;
            }

            cardsData.forEach((card, rowIndex) => {
                // Determine if row matches query globally
                let matchesSearch = false;
                if (card.name.toLowerCase().includes(cleanFilter)) {
                    matchesSearch = true;
                }
                
                if (!matchesSearch) {
                    for (let key in card.benefits) {
                        if (card.benefits[key].toLowerCase().includes(cleanFilter)) {
                            matchesSearch = true;
                            break;
                        }
                    }
                }

                if (cleanFilter !== '' && !matchesSearch) return; // Filter out rows not matching query

                const tr = document.createElement('tr');
                
                // Card column creation
                const tdCard = document.createElement('td');
                tdCard.setAttribute('data-label', 'Card');
                const a = document.createElement('a');
                a.href = card.url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.className = "card-link";

                const thumbPath = cardImageMap[card.name];
                if (thumbPath) {
                    const thumb = document.createElement('img');
                    thumb.src = thumbPath;
                    thumb.alt = `${card.name} card image`;
                    thumb.className = 'card-thumb';
                    thumb.loading = 'lazy';
                    thumb.decoding = 'async';
                    a.appendChild(thumb);
                }

                const cardName = document.createElement('span');
                cardName.className = 'card-name';
                cardName.innerHTML = highlightMarkup(card.name, cleanFilter);
                a.appendChild(cardName);
                tdCard.appendChild(a);
                tr.appendChild(tdCard);

                // Benefits columns creation
                activeBenefitKeys.forEach(key => {
                    const td = document.createElement('td');
                    td.setAttribute('data-label', columnLabels[key] || key);
                    const rawValue = card.benefits[key];

                    if (rawValue === "N/A") {
                        td.className = "benefit-cell na-cell";
                        td.innerHTML = '<ul class="benefit-ul"><li class="benefit-li">N/A</li></ul>';
                    } else {
                        td.className = "benefit-cell";
                        td.innerHTML = `<span class="cell-summary">${highlightMarkup(summarizeBenefit(rawValue, key), cleanFilter)}</span>`;
                        const benefitUrl = (card.benefitLinks && card.benefitLinks[key]) || card.url;
                        // Click management to capture cell context
                        td.addEventListener('click', () => openBenefitDetails(card.name, key, rawValue, benefitUrl));
                    }
                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            });
        }

        // Highlight matching substrings safely within HTML markup
        function highlightMarkup(text, pattern) {
            if (!pattern || text === "N/A") return text;
            const escapedPattern = pattern.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(`(${escapedPattern})`, 'gi');
            return text.replace(regex, '<mark class="highlight">$1</mark>');
        }

        // Deep-dive analysis and text parsing for the modal display
        function openBenefitDetails(cardName, technicalKey, rawString, officialUrl) {
            document.getElementById('mCardName').innerText = cardName;
            
            // Format column key for user view
            const humanReadableKey = technicalKey.charAt(0).toUpperCase() + technicalKey.slice(1);
            document.getElementById('mBenefitType').innerText = humanReadableKey === 'Transfers' ? 'Airport Transfers' : 
                                                               humanReadableKey === 'Insurance' ? 'Travel Insurance' : 
                                                               humanReadableKey === 'Protection' ? 'Insurance & Protection' : 
                                                               humanReadableKey === 'Other' ? 'Other Benefits' : humanReadableKey + ' Benefits';

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '';

            const sections = buildBenefitDetails(rawString);

            if (sections.length > 0) {
                const officialSection = document.createElement('div');
                officialSection.className = 'modal-section';

                const officialTitle = document.createElement('div');
                officialTitle.className = 'modal-section-title';
                officialTitle.innerText = 'Official page';

                const officialContent = document.createElement('div');
                officialContent.className = 'modal-section-content';
                const officialLink = document.createElement('a');
                officialLink.className = 'modal-link';
                officialLink.href = officialUrl;
                officialLink.target = '_blank';
                officialLink.rel = 'noopener noreferrer';
                officialLink.innerText = officialUrl;
                officialContent.appendChild(officialLink);

                officialSection.appendChild(officialTitle);
                officialSection.appendChild(officialContent);
                modalBody.appendChild(officialSection);

                const leadSection = document.createElement('div');
                leadSection.className = 'modal-section lead-section';

                const leadTitle = document.createElement('div');
                leadTitle.className = 'modal-section-title';
                leadTitle.innerText = 'Benefit summary';

                const leadContent = document.createElement('div');
                leadContent.className = 'modal-section-content';
                leadContent.innerText = sections[0].content;

                leadSection.appendChild(leadTitle);
                leadSection.appendChild(leadContent);
                modalBody.appendChild(leadSection);

                if (sections.length > 1) {
                    const detailIntro = document.createElement('div');
                    detailIntro.className = 'modal-section';
                    detailIntro.innerHTML = '<div class="modal-section-title">Detailed breakdown</div>';
                    modalBody.appendChild(detailIntro);

                    sections.slice(1).forEach((section) => {
                        const sectionDiv = document.createElement('div');
                        sectionDiv.className = 'modal-section';

                        const titleDiv = document.createElement('div');
                        titleDiv.className = 'modal-section-title';
                        titleDiv.innerText = section.title;

                        const contentDiv = document.createElement('div');
                        contentDiv.className = 'modal-section-content';
                        contentDiv.innerText = section.content;

                        sectionDiv.appendChild(titleDiv);
                        sectionDiv.appendChild(contentDiv);
                        modalBody.appendChild(sectionDiv);
                    });

                    const sourceSection = document.createElement('div');
                    sourceSection.className = 'modal-section';

                    const sourceTitle = document.createElement('div');
                    sourceTitle.className = 'modal-section-title';
                    sourceTitle.innerText = 'Source text';

                    const sourceContent = document.createElement('div');
                    sourceContent.className = 'modal-section-content';
                    sourceContent.innerText = rawString;

                    sourceSection.appendChild(sourceTitle);
                    sourceSection.appendChild(sourceContent);
                    modalBody.appendChild(sourceSection);
                }
            } else {
                modalBody.innerHTML = `<div class="na-modal-msg">No detailed breakdown is available for this benefit.</div>`;
            }

            modal.classList.add('active');
        }

        // Close modal workflows
        function closeModal() {
            modal.classList.remove('active');
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });

        // Search interface pipeline execution
        searchBar.addEventListener('input', (e) => {
            renderTable(e.target.value);
        });

        selectAllBtn.addEventListener('click', () => {
            selectedBenefitKeys = keyMapping.slice();
            renderBenefitCheckboxes();
            renderTable(searchBar.value);
        });

        clearAllBtn.addEventListener('click', () => {
            selectedBenefitKeys = [];
            renderBenefitCheckboxes();
            renderTable(searchBar.value);
        });

        // Initial launch configuration
        renderBenefitCheckboxes();
        renderTable();
    </script>
</body>
</html>
